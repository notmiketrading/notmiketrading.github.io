<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>notmiketrading</title>
<meta name="description" content="Futures day trader. Every account in one place.">
<meta name="theme-color" content="#0B0F14">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- A link-in-bio page is opened from a phone, once, over a cellular connection, by someone who is
     already half-distracted. So: one file, no framework, no analytics, and the only external
     request is the typeface - which has a system stack behind it, so a failed font load costs
     nothing but the look. -->

<meta property="og:type" content="profile">
<meta property="og:title" content="notmiketrading">
<meta property="og:description" content="Futures day trader. Every account in one place.">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">

<style>
  /* Killzonda's own tokens, so the two read as one operation. */
  :root{
    --bg:#0B0F14;
    --surface:#151C27;
    --surface-hi:#1C2534;
    --border:rgba(255,255,255,0.08);
    --border-hi:rgba(45,212,191,0.45);
    --text:#E8ECF3;
    --text-dim:#9AA7BD;
    --accent:#2DD4BF;
    --accent-soft:rgba(45,212,191,0.12);
    --r:14px;
    --ease:cubic-bezier(0.2,0,0,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    justify-content:center;
    /* viewport-fit plus these keeps the last link clear of the iPhone home indicator. */
    padding:calc(40px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
  }
  /* The brand's two glows, well under the text and never in the way of a tap. */
  body::before, body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
  body::before{
    top:-280px;left:50%;transform:translateX(-50%);width:720px;height:720px;
    background:radial-gradient(circle, rgba(45,212,191,0.20) 0%, rgba(45,212,191,0.06) 45%, rgba(45,212,191,0) 70%);
  }
  body::after{
    bottom:-340px;right:-200px;width:620px;height:620px;
    background:radial-gradient(circle, rgba(96,165,250,0.12) 0%, rgba(45,212,191,0.04) 50%, rgba(45,212,191,0) 75%);
  }

  main{position:relative;z-index:1;width:100%;max-width:460px;display:flex;flex-direction:column;}

  /* ---- who ---- */
  .top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:34px;}
  /* The mark is 2.6:1, so this is a plate rather than a square tile. A wide lockup in a square
     container is a thin band with dead space above and below it. */
  /* A square tile holding the wide mark, at the largest size that still breathes:
     the mark is 74% of the tile width, the same ratio as the option this came from. */
  /* The artwork brings its own background, so the tile only supplies the radius and the shadow. */
  .mark{
    width:96px;height:96px;border-radius:26px;overflow:hidden;
    border:1px solid var(--border);
    box-shadow:0 10px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .mark img{width:100%;height:100%;display:block;}
  h1{
    font-family:'Inter Tight',Inter,sans-serif;font-weight:800;font-size:27px;letter-spacing:-0.02em;line-height:1.15;
  }
  .bio{font-size:15px;line-height:1.5;color:var(--text-dim);max-width:330px;}
  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:var(--accent);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);}

  /* ---- the links ---- */
  .links{display:flex;flex-direction:column;gap:11px;}
  .link{
    display:flex;align-items:center;gap:15px;
    min-height:62px;padding:0 18px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--r);
    color:var(--text);
    text-decoration:none;
    font-size:15.5px;font-weight:600;
    transition:background 180ms var(--ease), border-color 180ms var(--ease), transform 180ms var(--ease);
    -webkit-tap-highlight-color:transparent;
  }
  .link:hover{background:var(--surface-hi);border-color:var(--border-hi);transform:translateY(-2px);}
  .link:active{transform:translateY(0) scale(0.99);}
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .ico{
    flex:0 0 auto;width:38px;height:38px;border-radius:11px;
    background:var(--bg);border:1px solid var(--border);
    display:grid;place-items:center;color:var(--accent);
  }
  .ico svg{width:19px;height:19px;fill:currentColor;display:block;}
  .label{flex:1 1 auto;min-width:0;}
  /* Direct children only: the offer row puts inline pills inside both of these. */
  .label > b{display:block;font-weight:600;}
  .label > span{display:block;font-size:12.5px;font-weight:500;color:var(--text-dim);margin-top:3px;}
  .chev{flex:0 0 auto;color:var(--text-dim);transition:transform 180ms var(--ease), color 180ms var(--ease);}
  .link:hover .chev{color:var(--accent);transform:translateX(3px);}
  .chev svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* The one row with an offer on it. Tinted rather than loud: it still has to sit in a list of
     five others without turning the page into an advert. */
  .link.is-offer{
    background:linear-gradient(180deg, rgba(45,212,191,0.10), rgba(45,212,191,0.04));
    border-color:rgba(45,212,191,0.34);
  }
  .link.is-offer:hover{background:linear-gradient(180deg, rgba(45,212,191,0.16), rgba(45,212,191,0.07));}
  .link.is-offer .ico{background:var(--accent-soft);border-color:rgba(45,212,191,0.30);}
  .tag{
    display:inline-block !important;margin-left:7px;vertical-align:1.5px;
    font-size:10px;font-weight:800;letter-spacing:0.09em;
    color:#04201C;background:var(--accent);
    padding:3px 7px;border-radius:999px;
  }
  .code{
    display:inline-block !important;font-weight:800;color:var(--accent);letter-spacing:0.08em;
    background:var(--accent-soft);border:1px solid rgba(45,212,191,0.28);
    padding:1px 6px;border-radius:5px;
  }

  footer{margin-top:34px;text-align:center;font-size:12px;color:var(--text-dim);}
  footer a{color:var(--text-dim);text-decoration:none;border-bottom:1px solid var(--border);}
  footer a:hover{color:var(--accent);border-color:var(--border-hi);}

  /* Someone who asked for less motion gets none of it. */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
    .link:hover{transform:none;}
  }
  @media (max-width:380px){
    h1{font-size:24px;}
    .link{min-height:58px;padding:0 15px;gap:13px;}
    .ico{width:35px;height:35px;}
  }
</style>
</head>
<body>

       To remove a link, delete its whole block, <a ...> through </a>.
